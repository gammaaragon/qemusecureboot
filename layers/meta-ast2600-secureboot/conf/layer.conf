# SPDX-License-Identifier: MIT
# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "ast2600-secureboot"
BBFILE_PATTERN_ast2600-secureboot := "^${LAYERDIR}/"
BBFILE_PRIORITY_ast2600-secureboot = "6"
LAYERVERSION_ast2600-secureboot = "1"

LAYERDEPENDS_ast2600-secureboot = "phosphor-layer"
LAYERSERIES_COMPAT_ast2600-secureboot = "wrynose whinlatter"

# =====================================================================
# FIT-signing config, global on purpose (layer.conf, not a bbappend).
#
# The kernel/ramdisk/dtb FIT is assembled by a different recipe than
# u-boot-aspeed-sdk (kernel-fit-image.bbclass, inherited by the kernel
# recipe). Bitbake gives every recipe its own isolated metadata --
# setting UBOOT_SIGN_ENABLE etc. in u-boot-aspeed-sdk's own .bbappend
# only affects u-boot's own build, not the kernel recipe's. Confirmed
# empirically: with these vars in the .bbappend instead, u-boot's own
# FIT (uboot-sign.bbclass, same recipe) came out correctly signed while
# the kernel FIT stayed plain-hash. Moving them here -- true global
# config, like a distro/machine .conf -- fixes that.
#
# UBOOT_SIGN_KEYDIR/SPL_SIGN_KEYDIR/FIT_KERNEL_SIGN_KEYDIR all point at
# the same ${TOPDIR}/fit-signing-keys, not ${UNPACKDIR}: UNPACKDIR is
# itself recipe-private (a different literal path per recipe), so it
# can't be a shared key location once these variables are global.
# TOPDIR (the build directory itself) is the one path guaranteed to
# resolve identically in every recipe's datastore.
#
# Known limitation, accepted for this lab rather than solved: nothing
# declares an explicit bitbake task dependency forcing the kernel
# recipe's FIT-assembly step to run after u-boot-aspeed-sdk's
# do_uboot_generate_rsa_keys has populated that directory. In production
# this key generation belongs in its own small recipe that both u-boot
# and the kernel explicitly DEPENDS on. Here, correctness instead relies
# on our own workflow: always build u-boot-aspeed-sdk's own recipe-scoped
# target before the image-level build that needs its keys (scripts/
# build-image.sh runs the full image target, which does this already).
#
# --- History of getting here (2026-09-02), all superseded below ---
#
# SPL_SIGN_ENABLE=0, UBOOT_FITIMAGE_ENABLE=0: SPL's own verification of
# U-Boot's FIT (layer 2, SPL -> U-Boot-proper) hangs indefinitely under
# QEMU -- ruled out slow unaccelerated RSA by letting a run sit for 25
# minutes with zero further console output, at both rsa4096 and rsa2048.
# Setting only SPL_SIGN_ENABLE=0 was not enough on its own: concat_dtb()
# (embeds the kernel-FIT verification pubkey into u-boot.dtb) is gated by
# UBOOT_SIGN_ENABLE alone and unconditionally marks that key REQUIRED for
# any FIT verification, so SPL still hard-refused an unsigned "uboot" FIT
# ("Failed to verify required signature") -- fast this time, not hung.
# UBOOT_FITIMAGE_ENABLE=0 removed the u-boot FIT entirely so SPL falls
# back to loading a plain (non-FIT) u-boot.bin, same path every other
# build here already boots with.
#
# That got SPL past its own hang, but U-Boot proper's *kernel*-FIT
# verification (layer 3 -- a different, non-size-constrained RSA code
# path than SPL's "tiny" one) then hung the same way: confirmed with runs
# up to 600s (10 minutes), zero progress. So this is not a SPL/tiny-mode
# problem specifically -- something about RSA-signature verification in
# this u-boot-aspeed-sdk fork does not complete under QEMU, at either
# stage. Root cause not found at this point -- see below for what it
# turned out to be.
#
# --- Root causes found and fixed (2026-09-02), all three layers now boot
#     with live, working RSA-4096/SHA-512 signature verification ---
#
# The "hang" above was never a real hang -- confirmed via GDB that SPL's
# RSA verification was spinning forever inside CONFIG_ASPEED_ACRY's
# hardware-accelerator driver, polling a status register this QEMU
# version's ast2600-evb machine doesn't implement at all. Fixed with
# disable-aspeed-acry.cfg (see the u-boot-aspeed-sdk .bbappend), which
# forces software RSA modexp instead -- SPL's own checks (layer 2) have
# been passing cleanly ever since.
#
# With that fix, layer 3 (kernel-FIT verification) stopped hanging but
# started crashing QEMU itself instead -- a real, confirmed out-of-bounds
# read in QEMU 8.2.2's own hw/misc/aspeed_hace.c device model, plus two
# further bugs in the same file's accumulate-mode hash reconstruction once
# the crash was fixed (a wrong-index caching bug, and a
# stale-pointer-into-guest-memory bug that produced a wrong digest
# silently instead of crashing). Two local patches were carried for these
# at the time. As of upstream QEMU 11.1.0 all three are gone -- the
# accumulate-mode code was rewritten upstream in a way that eliminates
# the bug class entirely, not just patches around it. scripts/run-qemu.sh
# --secureboot now uses a plain-upstream-11.1.x build via
# scripts/build-patched-qemu.sh -- see that script for what it still
# patches and why.
#
# One more real bug turned out to matter more than any of the QEMU ones:
# the deployed kernel FIT can go stale relative to the signing key if the
# key gets regenerated (e.g. by a forced recipe rebuild) without also
# forcing linux-yocto-fitimage to re-sign -- caught by cross-checking with
# u-boot's own host-side fit_check_sign tool (no QEMU involved at all),
# which is worth reaching for FIRST on any future "Bad Data Hash" before
# assuming it's another QEMU bug.
#
# socsec/OTP (layer 1) is untouched by any of this: those are pure
# build-time artifacts, independent of uboot-sign.bbclass/
# kernel-fit-image.bbclass, verified working and documented separately.
# =====================================================================
FIT_SIGNING_KEYDIR = "${TOPDIR}/fit-signing-keys"

UBOOT_SIGN_ENABLE = "1"
UBOOT_FITIMAGE_ENABLE = "1"
SPL_SIGN_ENABLE = "1"
UBOOT_FIT_GENERATE_KEYS = "1"

UBOOT_SIGN_KEYNAME = "rsa_oem_fitimage_key"
SPL_SIGN_KEYNAME = "rsa_oem_fitimage_key"
FIT_KERNEL_SIGN_KEYNAME = "rsa_oem_fitimage_key"

UBOOT_SIGN_KEYDIR = "${FIT_SIGNING_KEYDIR}"
SPL_SIGN_KEYDIR = "${FIT_SIGNING_KEYDIR}"
FIT_KERNEL_SIGN_KEYDIR = "${FIT_SIGNING_KEYDIR}"

UBOOT_FIT_HASH_ALG = "sha512"
UBOOT_FIT_SIGN_ALG = "rsa4096"
UBOOT_FIT_SIGN_NUMBITS = "4096"

FIT_HASH_ALG = "sha512"
FIT_SIGN_ALG = "rsa4096"
FIT_SIGN_NUMBITS = "4096"
FIT_KERNEL_SIGN_ENABLE = "1"
