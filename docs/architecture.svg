<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 900" role="img"
     aria-label="Boot-time trust chain: the ROM layer either performs no check (stock QEMU) or verifies SPL against an OTP-fused RSA key (this repo's vboot ROM); either way, the same SPL to U-Boot to kernel FIT-signature chain runs downstream, using a software build key rather than a hardware anchor.">
  <defs>
    <marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3a352b"/>
    </marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0f6b57"/>
    </marker>
    <marker id="arrow-fail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9c3327"/>
    </marker>
    <marker id="arrow-neutral" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a8270"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="900" rx="10" fill="#fbfaf7"/>

  <text x="450" y="34" text-anchor="middle" font-family="Georgia, serif" font-size="19" font-weight="700" fill="#1c1a16">qemusecureboot &#8212; boot-time trust chain</text>
  <text x="450" y="54" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#6f6650">same FIT-signature chain runs either way &#8212; only the ROM layer's hardware anchor differs</text>

  <!-- build strip -->
  <rect x="260" y="76" width="380" height="54" rx="6" fill="#ffffff" stroke="#3a352b" stroke-width="1.4"/>
  <text x="450" y="98" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1c1a16">bitbake obmc-phosphor-image</text>
  <text x="450" y="115" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#6f6650">+ meta-ast2600-lab&#160;&#160;or&#160;&#160;+ meta-ast2600-secureboot</text>

  <line x1="450" y1="130" x2="450" y2="160" stroke="#3a352b" stroke-width="1.6" marker-end="url(#arrow-ink)" fill="none"/>
  <text x="464" y="149" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#6f6650">build-image.sh --lab / --secureboot</text>

  <rect x="260" y="160" width="380" height="42" rx="6" fill="#efe9db" stroke="#3a352b" stroke-width="1.2"/>
  <text x="450" y="186" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#1c1a16">deploy image &#8212; obmc-phosphor-image-*.static.mtd</text>

  <line x1="450" y1="202" x2="450" y2="222" stroke="#3a352b" stroke-width="1.6" fill="none"/>
  <line x1="230" y1="222" x2="670" y2="222" stroke="#3a352b" stroke-width="1.6" fill="none"/>
  <line x1="230" y1="222" x2="230" y2="238" stroke="#3a352b" stroke-width="1.6" marker-end="url(#arrow-ink)" fill="none"/>
  <line x1="670" y1="222" x2="670" y2="238" stroke="#3a352b" stroke-width="1.6" marker-end="url(#arrow-ink)" fill="none"/>

  <!-- column headers -->
  <rect x="70" y="238" width="320" height="34" rx="5" fill="#efe9db" stroke="#3a352b" stroke-width="1.1"/>
  <text x="230" y="260" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#1c1a16">machine: ast2600-evb (stock)</text>

  <rect x="510" y="238" width="320" height="34" rx="5" fill="#dcece5" stroke="#0f6b57" stroke-width="1.1"/>
  <text x="670" y="260" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#0f6b57">machine: ast2600-evb-secureboot</text>

  <line x1="230" y1="272" x2="230" y2="298" stroke="#3a352b" stroke-width="1.6" marker-end="url(#arrow-ink)" fill="none"/>
  <line x1="670" y1="272" x2="670" y2="298" stroke="#0f6b57" stroke-width="1.6" marker-end="url(#arrow-accent)" fill="none"/>

  <!-- "identical downstream" band, drawn before boxes so boxes sit on top -->
  <rect x="55" y="416" width="790" height="300" rx="8" fill="#0f6b57" fill-opacity="0.06" stroke="#0f6b57" stroke-opacity="0.35" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="450" y="410" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" letter-spacing="0.02em" fill="#0f6b57">IDENTICAL DOWNSTREAM &#8212; SAME BUILD-TIME RSA KEY, NEITHER SIDE HARDWARE-ANCHORED</text>

  <!-- ROM row -->
  <rect x="70" y="298" width="320" height="64" rx="6" fill="#ffffff" stroke="#3a352b" stroke-width="1.4"/>
  <text x="230" y="324" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#1c1a16">boot ROM (stock QEMU)</text>
  <text x="230" y="342" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#6f6650">hw/arm/aspeed.c write_boot_rom</text>
  <text x="230" y="356" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#6f6650">no OTP device on this machine</text>

  <rect x="510" y="298" width="320" height="64" rx="6" fill="#ffffff" stroke="#0f6b57" stroke-width="1.6"/>
  <text x="670" y="324" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#0f6b57">vbootrom-ast2600 (this repo)</text>
  <text x="670" y="342" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#4b5d55">verify.c &#8594; otp.c, rsa_mod_exp.c, sha256/512.c</text>
  <text x="670" y="356" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#4b5d55">key read from real OTP fuse content</text>

  <!-- left: unconditional -->
  <line x1="230" y1="362" x2="230" y2="428" stroke="#8a8270" stroke-width="1.6" marker-end="url(#arrow-neutral)" fill="none"/>
  <text x="242" y="398" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#6f6650">copy flash&#8594;0x0, jump &#8212; no check</text>

  <!-- right: valid branch -->
  <line x1="750" y1="362" x2="750" y2="428" stroke="#0f6b57" stroke-width="1.8" marker-end="url(#arrow-accent)" fill="none"/>
  <text x="825" y="398" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#0f6b57">verify vs OTP key &#8212; valid</text>

  <!-- right: invalid branch to HALT -->
  <polyline points="590,362 590,392 450,392 450,418" fill="none" stroke="#9c3327" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#arrow-fail)"/>
  <text x="463" y="388" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#9c3327">invalid &#8594; halt</text>

  <rect x="393" y="418" width="114" height="46" rx="6" fill="#f3ddd6" stroke="#9c3327" stroke-width="1.4"/>
  <text x="450" y="437" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#9c3327">HALT</text>
  <text x="450" y="450" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#9c3327">UART: header/sig error</text>

  <!-- SPL row -->
  <rect x="70" y="428" width="320" height="56" rx="6" fill="#ffffff" stroke="#3a352b" stroke-width="1.3"/>
  <text x="230" y="452" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#1c1a16">SPL (u-boot-spl)</text>
  <text x="230" y="468" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#6f6650">ast2600_openbmc_spl_defconfig</text>

  <rect x="510" y="428" width="320" height="56" rx="6" fill="#ffffff" stroke="#3a352b" stroke-width="1.3"/>
  <text x="670" y="452" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#1c1a16">SPL (u-boot-spl)</text>
  <text x="670" y="468" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#6f6650">ast2600_openbmc_spl_defconfig</text>

  <line x1="230" y1="484" x2="230" y2="524" stroke="#3a352b" stroke-width="1.6" marker-end="url(#arrow-ink)" fill="none"/>
  <text x="242" y="508" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#4b5d55">verify u-boot FIT sig</text>
  <line x1="670" y1="484" x2="670" y2="524" stroke="#3a352b" stroke-width="1.6" marker-end="url(#arrow-ink)" fill="none"/>
  <text x="682" y="508" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#4b5d55">verify u-boot FIT sig</text>

  <!-- U-Boot row -->
  <rect x="70" y="524" width="320" height="56" rx="6" fill="#ffffff" stroke="#3a352b" stroke-width="1.3"/>
  <text x="230" y="548" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#1c1a16">U-Boot proper</text>
  <text x="230" y="564" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#6f6650">CONFIG_FIT_SIGNATURE=y</text>

  <rect x="510" y="524" width="320" height="56" rx="6" fill="#ffffff" stroke="#3a352b" stroke-width="1.3"/>
  <text x="670" y="548" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#1c1a16">U-Boot proper</text>
  <text x="670" y="564" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#6f6650">CONFIG_FIT_SIGNATURE=y</text>

  <line x1="230" y1="580" x2="230" y2="620" stroke="#3a352b" stroke-width="1.6" marker-end="url(#arrow-ink)" fill="none"/>
  <text x="242" y="604" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#4b5d55">verify kernel FIT sig</text>
  <line x1="670" y1="580" x2="670" y2="620" stroke="#3a352b" stroke-width="1.6" marker-end="url(#arrow-ink)" fill="none"/>
  <text x="682" y="604" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#4b5d55">verify kernel FIT sig</text>

  <!-- Kernel row -->
  <rect x="70" y="620" width="320" height="56" rx="6" fill="#ffffff" stroke="#3a352b" stroke-width="1.3"/>
  <text x="230" y="644" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#1c1a16">Linux kernel + initramfs</text>
  <text x="230" y="660" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#6f6650">fitImage, signed ramdisk-1 node</text>

  <rect x="510" y="620" width="320" height="56" rx="6" fill="#ffffff" stroke="#3a352b" stroke-width="1.3"/>
  <text x="670" y="644" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#1c1a16">Linux kernel + initramfs</text>
  <text x="670" y="660" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#6f6650">fitImage, signed ramdisk-1 node</text>

  <line x1="230" y1="676" x2="230" y2="706" stroke="#3a352b" stroke-width="1.6" marker-end="url(#arrow-ink)" fill="none"/>
  <line x1="670" y1="676" x2="670" y2="706" stroke="#3a352b" stroke-width="1.6" marker-end="url(#arrow-ink)" fill="none"/>

  <!-- login pills -->
  <rect x="170" y="706" width="120" height="34" rx="17" fill="#efe9db" stroke="#3a352b" stroke-width="1.2"/>
  <text x="230" y="728" text-anchor="middle" font-family="'IBM Plex Mono', Consolas, monospace" font-size="11.5" fill="#1c1a16">login:</text>

  <rect x="610" y="706" width="120" height="34" rx="17" fill="#efe9db" stroke="#3a352b" stroke-width="1.2"/>
  <text x="670" y="728" text-anchor="middle" font-family="'IBM Plex Mono', Consolas, monospace" font-size="11.5" fill="#1c1a16">login:</text>

  <!-- footer badges -->
  <line x1="230" y1="740" x2="230" y2="766" stroke="#6f6650" stroke-width="1.3" fill="none"/>
  <line x1="670" y1="740" x2="670" y2="766" stroke="#6f6650" stroke-width="1.3" fill="none"/>

  <rect x="90" y="766" width="280" height="30" rx="15" fill="#efe9db" stroke="#8a8270" stroke-width="1.1"/>
  <text x="230" y="786" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#6f6650">no hardware anchor</text>

  <rect x="530" y="766" width="280" height="30" rx="15" fill="#dcece5" stroke="#0f6b57" stroke-width="1.2"/>
  <text x="670" y="786" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#0f6b57">OTP-fused anchor</text>

  <text x="230" y="812" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#6f6650">experiment D1: attacker SPL boots unchallenged</text>
  <text x="670" y="812" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#0f6b57">experiment D2: attacker SPL rejected pre-SPL</text>

  <!-- separator -->
  <line x1="55" y1="850" x2="845" y2="850" stroke="#ded5bd" stroke-width="1"/>

  <text x="450" y="876" text-anchor="middle" font-family="'IBM Plex Mono', Consolas, monospace" font-size="10" fill="#9a9179">layers/meta-ast2600-secureboot/vbootrom-ast2600/  &#183;  experiments/secure-boot-demo/</text>

</svg>
